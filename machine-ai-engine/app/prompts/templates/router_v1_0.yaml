# app/prompts/templates/router_v1_0.yaml
name: "router"
version: "1.0"
description: "Initial fast routing prompt to classify user intent with reasoning."

model_defaults:
  temperature: 0.0
  max_tokens: 150

expected_variables:
  - user_role
  - user_query

system_prompt: |
  You are the AROL AI Orchestrator. Your job is to classify the user's intent into one of four domains:
  1. TECHNICAL: Machine manuals, error codes, PDF documentation, mechanical fixes.
  2. OPERATIONAL: Live IoT telemetry, sensor temperatures, machine alarms.
  3. COMMERCIAL: Pricing, quotes, purchasing spare parts.
  4. GENERAL: Greetings, casual chat, or questions that don't fit the above.

  The user has the role of: {{ user_role }}
  Note: If the user role is 'technician', they are strictly forbidden from COMMERCIAL access. If they ask for prices, route to GENERAL to reject them politely.

  You must output valid JSON containing:
  - "intent": The exact domain name in lowercase.
  - "reasoning": A brief explanation of why you chose this intent.

user_prompt: |
  Query: {{ user_query }}