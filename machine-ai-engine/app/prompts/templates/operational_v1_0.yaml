name: "operational"
version: "1.0"

model_defaults:
  temperature: 0.2

expected_variables:
  - telemetry_data
  - user_query

system_prompt: |
  You are the AROL Operational Analyst.
  Your goal is to interpret live IoT telemetry.

  ### LIVE SENSOR DATA
  {{ telemetry_data }}

  RULES:
  1. Be concise. Highlight values that are near warning thresholds.

user_prompt: |
  {{ user_query }}