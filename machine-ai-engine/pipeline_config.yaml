# pipeline_config.yaml

memory:
  short_term_enabled: true
  long_term_enabled: false
  roadmap_enabled: true
  max_history_messages: 6

rag:
  enabled: true
  top_k: 3
  reranking_enabled: false

budget:
  max_iterations_per_answer: 3
  max_tokens_per_answer: 2000
  max_cost_per_answer: 0.02

control:
  guardrails_enabled: true
  validate_response_enabled: true
  use_intent_router: true

# 🔗 Custom URLs and Auth Tokens
endpoints:
  openai_api_base: null                        # e.g., "https://api.openai.com/v1" or custom proxy
  openai_api_key: "your_openai_api_key_here"   # Or load from environment variables
  
  gemini_api_base: null                        # e.g., custom gateway if applicable
  gemini_api_key: "your_gemini_api_key_here"   # Or load from environment variables
  
  ollama_api_base: "http://localhost:11434"    # Local Ollama endpoint

llm_routing:
  planner_model: "ollama/llama3"
  worker_model: "ollama/llama3"
  router_model: "ollama/llama3"
  critic_model: "ollama/llama3"

